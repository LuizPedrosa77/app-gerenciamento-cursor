version: "3.8"
services:
  frontend:
    image: hubnexusai/gpfx-frontend:latest
    networks:
      - digital_network
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.gpfx.rule=Host(`fx.testedev.online`)
        - traefik.http.routers.gpfx.entrypoints=websecure
        - traefik.http.services.gpfx.loadbalancer.server.port=80
        - traefik.http.routers.gpfx.service=gpfx
        - traefik.http.routers.gpfx.tls.certresolver=le
        - com.centurylinklabs.watchtower.enable=true
  backend:
    image: hubnexusai/gpfx-backend:latest
    networks:
      - digital_network
      - traefik_public
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-true}
      - REDIS_URL=${REDIS_URL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - MTCONNECT_API_KEY=${MTCONNECT_API_KEY}
      - BROKER_CREDENTIALS_KEY=${BROKER_CREDENTIALS_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.gpfx-api.rule=Host(`api.testedev.online`)
        - traefik.http.routers.gpfx-api.entrypoints=websecure
        - traefik.http.services.gpfx-api.loadbalancer.server.port=8000
        - traefik.http.routers.gpfx-api.service=gpfx-api
        - traefik.http.routers.gpfx-api.tls.certresolver=le
        - com.centurylinklabs.watchtower.enable=true
networks:
  digital_network:
    external: true
    name: digital_network
  traefik_public:
    external: true
    name: traefik_public
